# Reproduces the legacy fixture 11_near_canonical_B (~2023 mini-ELF, high res).
# Single 750 nm filter, 7 wavelength samples, modern-canonical default
# normalization (max_intensity_norm=True).

pupil:
  resolution: 256
  extent: 3.1329949753

aperture:
  type: segmented_circular
  segment_diameter: 0.4975
  layout: elf
  n_segments: 15
  ring_radius: 1.25
  supersample: 1  # pre-2024-09 variant did not supersample the aperture

correctors:
  segments:
    type: segmented_ptt
    piston_scale: 1.0e-6
    tip_tilt_scale: 1.0e-6
    wavefront_role: actuate
    target_strategy: actuators
    target: true

corrector_chain: [segments]

focal_planes:
  filter1:
    type: angular
    central_lam: 0.75e-6
    focal_extent: 2.6496      # 0.0207 arcsec/pix * 128
    focal_res: 128
    fractional_bandwidth: 0.172
    num_samples: 7

outputs:
  psf:
    tap:
      type: intensity
      focal_planes: [filter1]
    post_processing:
      - type: max_intensity_norm

strehl_core_rad: null
