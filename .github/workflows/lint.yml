name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install tools
        run: pip install ruff>=0.5

      - name: Ruff check
        run: ruff check src tests

      - name: Ruff format
        run: ruff format --check src tests
