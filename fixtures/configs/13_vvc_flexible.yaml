# Reproduces the legacy fixture 13_vvc_flexible. SCExAO pupil via
# miles_synthpsf + VectorVortexCoronagraph charge=4, 35 Zernike modes,
# F750 filter at 5 wavelengths, per_sample_norm.

pupil:
  resolution: 256
  extent: 8.1795   # 1.05 * 7.79

aperture:
  type: external_pupil
  module: test_fixtures/helpers/miles_synthpsf/2024-05_vampires_vvc.py
  function: generate_pupil
  mode: field
  kwargs:
    outer: 0.9835858585858586    # 7.79 / 7.92
  area: 190.6630

correctors:
  zernike_dm:
    type: zernike
    n_modes: 35
    zernike_diameter: 7.79
    starting_mode: 2
    actuate_scale: 1.0e-6
    wavefront_role: actuate
    target_strategy: actuators
    target: true

corrector_chain: [zernike_dm]

coronagraph:
  type: vector_vortex
  charge: 4
  lyot:
    type: external_pupil
    module: test_fixtures/helpers/miles_synthpsf/2024-05_vampires_vvc.py
    function: generate_pupil
    mode: field
    kwargs:
      outer: 0.9
      inner: 0.43
      scale: 1.4
      spider_scale: 1.6

focal_planes:
  filter1:
    type: angular
    central_lam: 7.48e-7
    focal_extent: 0.768       # 1e-3 * 6 * 128
    focal_res: 128
    fractional_bandwidth: 0.06417112299  # 48e-9 / 7.48e-7
    num_samples: 5

outputs:
  psf:
    tap:
      type: intensity
      focal_planes: [filter1]
    post_processing:
      - type: per_sample_norm

strehl_core_rad: null
