name: docs

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pandoc (nbsphinx needs it to convert notebooks)
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Install package + doc deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[doc]"

      - name: Build Sphinx docs
        run: |
          cd docs && make html

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html
