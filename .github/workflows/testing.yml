name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools_scm needs full history

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The JAX backend suites skip cleanly when jax is absent, so install
      # the extra explicitly (and fail loudly if it didn't take) to keep
      # them exercised in CI. Current jax releases require Python >= 3.11;
      # the 3.10 legs run the hcipy-only suite.
      - name: Install JAX backend extra
        if: matrix.python-version != '3.10'
        run: |
          pip install -e ".[dev,jax]"
          python -c "import jax; print('jax', jax.__version__)"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest --cov=telescope_sim --cov-report=xml

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
