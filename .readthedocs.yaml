# Read the Docs configuration
# https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-24.04
  tools:
    # Pin to a Python version we actively test against (matrix is 3.10-3.12).
    # RTD's default 3.13 is unverified for our deps.
    python: "3.12"
  # nbsphinx renders the pre-executed tutorial notebooks via pandoc; same
  # system dep as our CI docs workflow.
  apt_packages:
    - pandoc

sphinx:
  configuration: docs/conf.py

python:
  install:
    # Install the package itself (autodoc / automodapi need to import
    # telescope_sim to introspect) plus the [doc] extras
    # (sphinx, nbsphinx, sphinx-automodapi, numpydoc, ...).
    - method: pip
      path: .
      extra_requirements:
        - doc
