# Reproduces the legacy fixture 09_vampires_base (VAMPIRES SCExAO 2023-10).
# Single SCExAO pupil generated by miles_pupil.generate_pupil, plus a
# 10-mode Zernike DM. Single 760nm filter, 5 wavelengths, per_sample_norm.

pupil:
  resolution: 256
  extent: 8.1795  # 1.05 * 7.79

aperture:
  type: external_pupil
  module: test_fixtures/helpers/miles_pupil/2023-10_vampires.py
  function: generate_pupil
  mode: field
  kwargs:
    outer: 0.9835858585858586  # 7.79 / 7.92
  area: 190.6630         # pi * 7.79^2  (matches legacy aperture_area)

correctors:
  zernike_dm:
    type: zernike
    n_modes: 10
    zernike_diameter: 7.79
    starting_mode: 2
    actuate_scale: 1.0e-6
    wavefront_role: actuate
    target_strategy: actuators
    target: true

corrector_chain: [zernike_dm]

focal_planes:
  filter1:
    type: angular
    central_lam: 0.760e-6
    focal_extent: 0.768   # 1e-3 * 6 (focal_pix_mas) * 128 (focal_res)
    focal_res: 128
    fractional_bandwidth: 0.04210526316  # 32e-9 / 760e-9
    num_samples: 5

outputs:
  psf:
    tap:
      type: intensity
      focal_planes: [filter1]
    post_processing:
      - type: per_sample_norm

strehl_core_rad: null
