[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "telescope-sim"
dynamic = ["version"]
description = "Composable, config-driven simulation of multi-aperture telescope PSFs, DMs, coronagraphs, and fiber coupling — built on HCIPy."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Ian Cunnyngham", email = "ian@morphoptic.com" },
]
keywords = [
    "astronomy",
    "optics",
    "telescope",
    "psf",
    "adaptive-optics",
    "atmosphere",
    "coronagraphy",
    "hcipy",
    "simulation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "hcipy>=0.6",
    "pydantic>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.5",
    "mypy>=1.0",
    "ipykernel",
    "ipywidgets",
]
doc = [
    "sphinx>=7.0",
    "sphinx_rtd_theme",
    "nbsphinx",
    "sphinx-automodapi",
    "numpydoc",
    "jupyter_client",
    "nbclient",
    "nbformat",
    "nbconvert",
    "ipykernel",
]
fixtures = [
    # Extras for the regression-suite tooling (digest writers, comparisons).
    "matplotlib",
    "tqdm",
]

[project.urls]
Homepage = "https://github.com/icunnyngham/telescope-sim"
Documentation = "https://telescope-sim.readthedocs.io"
Repository = "https://github.com/icunnyngham/telescope-sim"
Issues = "https://github.com/icunnyngham/telescope-sim/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
telescope_sim = [
    "presets/*.yaml",
    "helpers/**/*.py",
]

[tool.setuptools_scm]
write_to = "src/telescope_sim/_version.py"
fallback_version = "0.0.0+unknown"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (run with --runslow)",
    "fixture: end-to-end regression against a captured fixture digest",
    "fiber: long-running fiber/MMF fixture (run with --runfiber, separate from --runslow)",
]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"
# Tell ruff which directory is the first-party source. Without this, ruff
# walks the project root looking for top-level dirs that match imports and
# can misclassify locally cloned reference libraries (e.g. a sibling
# `external/hcipy/` clone developers keep for cross-reference) as
# first-party. With `src` set, only `src/telescope_sim` is first-party —
# matches CI behaviour where `hcipy` lives in site-packages.
src = ["src"]

[tool.ruff.lint.isort]
known-first-party = ["telescope_sim"]
known-third-party = ["hcipy", "pydantic", "numpy", "scipy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PL"]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
# Tests intentionally import locally inside test functions for lazy loading
# and to interleave with warnings.catch_warnings(); fixture configs and
# digest_lib live outside src/ and need sys.path manipulation.
"tests/**/*.py" = ["PLC0415"]
"fixtures/runner/*.py" = ["PLC0415"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]
