name: telescope-sim-dev
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy>=1.24
  - scipy>=1.10
  - matplotlib
  - pyyaml>=6.0
  - jupyter
  - ipykernel
  - ipywidgets
  - tqdm
  - pip:
      - hcipy>=0.6
      - pydantic>=2.0
      - pytest>=7.0
      - pytest-cov>=4.0
      - ruff>=0.5
      - mypy>=1.0
      - sphinx>=7.0
      - sphinx_rtd_theme
      - nbsphinx
      - sphinx-automodapi
      - numpydoc
      - jupyter_client
      - nbclient
      - nbformat
      - nbconvert
      # editable install of this package after env creation:
      #   pip install -e ".[dev,doc]"
