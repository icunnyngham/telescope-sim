# Test config for tests/unit/test_actuator_grid_corrector.py (fit-role).
#
# Same minimal pipeline as actuator_grid_dm.yaml, but the DM runs in
# wavefront_role=fit against the cumulative pre-self OPD stream: an
# atmosphere passed via sample(atmos=...) seeds the stream, the DM
# least-squares-fits it onto its influence basis, and the pipeline
# negates the fit — "ideal AO, fitting-error-limited".

pupil:
  resolution: 64
  extent: 1.05

aperture:
  type: external_pupil
  module: hcipy
  function: make_circular_aperture
  mode: callable
  kwargs:
    diameter: 1.0
  area: 0.7853981633974483  # pi * (0.5)^2

correctors:
  dm:
    type: actuator_grid
    num_actuators: 8
    actuator_pitch: 0.125
    influence: gaussian
    rotation_deg: 0.0
    actuate_scale: 1.0e-6
    wavefront_role: fit
    fit_source: cumulative_phase_pre_self
    target_strategy: none
    target: false

corrector_chain: [dm]

focal_planes:
  filter1:
    type: angular
    central_lam: 1.0e-6
    focal_extent: 1.0e-5
    focal_res: 64
    fractional_bandwidth: 0.0
    num_samples: 1

outputs:
  psf:
    tap:
      type: intensity
      focal_planes: [filter1]
    post_processing: []

strehl_core_rad: null
